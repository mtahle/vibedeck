name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: >-
          python3 -m py_compile
          scripts/install.py
          skills/project-os/scripts/bootstrap_project_os.py
      - name: Test
        run: python3 -m unittest discover -s tests -v
